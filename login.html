    <link rel="stylesheet" href="css/style.css">

    <link rel="icon" type="image/png" href="silas.png">

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
</head>

<body>

    <header class="navbar">

        <a href="index.html" class="nav-logo">
            Our System
        </a>

        <nav class="nav-links">

            <a href="index.html">
                Home
            </a>

            <a href="members.html">
                Members
            </a>

            <a href="experience.html">
                Experience

            <a href="triggers.html">

               Our Calendar
            </a>

        </nav>

    </header>
    

    <main class="container">

        <section class="login-section">

            <p class="eyebrow">PRIVATE ACCESS</p>

            <h1>Log in</h1>

            <p>
                Log in to manage fronting information.
            </p>


            <form id="login-form">

                <label for="email">
                    Email
                </label>

                <input
                    type="email"
                    id="email"
                    required
                >


                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    required
                >


                <button type="submit">
                    Log in
                </button>

                <p id="login-message"></p>

            </form>

        </section>

    </main>


    <script src="js/login.js"></script>

</body>
</html>
